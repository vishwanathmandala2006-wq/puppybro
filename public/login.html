<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PuppyBro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🐕 PuppyBro</h1>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="register.html" class="nav-link">Register</a>
            </div>
        </div>
    </nav>

    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="text-align: center; color: #666; margin-bottom: 2rem;">Sign in to your PuppyBro account</p>
        <div id="alertContainer"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
        <p style="text-align: center; margin-top: 2rem; color: #666;">
            New to PuppyBro? <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Create Account</a> • 
            <a href="admin-login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Admin</a> • 
            <a href="ngo-login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">NGO</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = '';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const data = await login(email, password);
                alertContainer.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';
                const next = new URLSearchParams(window.location.search).get('next');
                // Redirect based on role or 'next' query param
                setTimeout(() => {
                    if (next) {
                        window.location.href = decodeURIComponent(next);
                    } else if (data.user.role === 'admin' || data.user.role === 'ngo') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'user-dashboard.html';
                    }
                }, 1000);
            } catch (error) {
                alertContainer.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
