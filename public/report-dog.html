<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Dog - PuppyBro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🐕 PuppyBro</h1>
            </div>
            <div class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="report-dog.html" class="nav-link active">Report Dog</a>
                <a href="lost-found.html" class="nav-link">Lost & Found</a>
                <a href="adoption.html" class="nav-link">Adoption</a>
                <a href="volunteer.html" class="nav-link">Volunteer</a>
                <a href="sterilization.html" class="nav-link">Sterilization</a>
                <a href="track-status.html" class="nav-link">Track Status</a>
                <div class="nav-auth" id="navAuth">
                    <a href="login.html" class="btn btn-outline">Login</a>
                </div>
                <div class="nav-user" id="navUser" style="display: none;">
                    <span id="userName"></span>
                    <button class="btn btn-outline" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding: 2rem 0;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Report Stray or Injured Dog</h2>
        <div class="form-container">
            <div id="alertContainer"></div>
            <form id="reportForm">
                <div class="form-group">
                    <label for="location_area">Location Area *</label>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <input type="text" id="location_area" name="location_area" placeholder="e.g., Downtown, Park Street" required style="flex: 1; min-width: 200px;">
                        <button type="button" onclick="shareMyLocation()" class="btn btn-outline" style="white-space: nowrap;">📍 Share My Location</button>
                    </div>
                    <small id="locationStatus"></small>
                </div>
                <div class="form-group">
                    <label for="location_description">Location Description</label>
                    <textarea id="location_description" name="location_description" rows="2" placeholder="More specific location details"></textarea>
                </div>
                <div class="form-group">
                    <label for="issue_type">Issue Type *</label>
                    <select id="issue_type" name="issue_type" required>
                        <option value="">Select type</option>
                        <option value="Aggressive">⚠️ Aggressive Dogs (High Priority)</option>
                        <option value="Injured">Injured Dog</option>
                        <option value="Stray">Stray Dog</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" name="description" rows="4" placeholder="Describe the situation, dog's condition, etc." required></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Upload Image (Optional)</label>
                    <input type="file" id="image" name="image" accept="image/*">
                    <small>Max file size: 5MB. Formats: JPG, PNG, GIF</small>
                    <div id="imagePreview"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Report</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/rescue.js"></script>
    <script>
        checkAuthStatus();
        
        // Image preview
        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.innerHTML = `<img src="${e.target.result}" class="image-preview" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
