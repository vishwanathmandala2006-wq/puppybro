<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Registration - PuppyBro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🐕 PuppyBro</h1>
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="ngo-login.html" class="nav-link">NGO Login</a>
            </div>
        </div>
    </nav>

    <div class="form-container">
        <h2 style="text-align: center; margin-bottom: 2rem;">NGO Registration</h2>
        <p style="text-align: center; color: #666; margin-bottom: 2rem;">
            Register your NGO organization to manage dog welfare activities, view all reports, and manage adoptions.
        </p>
        <div id="alertContainer"></div>
        <form id="ngoRegisterForm">
            <div class="form-group">
                <label for="organization_name">Organization Name *</label>
                <input type="text" id="organization_name" name="organization_name" required>
            </div>
            <div class="form-group">
                <label for="name">Contact Person Name *</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label for="address">Organization Address</label>
                <textarea id="address" name="address" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register NGO</button>
        </form>
        <p style="text-align: center; margin-top: 1rem;">
            Already have an account? <a href="ngo-login.html">Login here</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('ngoRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = '';

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value || null,
                address: document.getElementById('address').value || null,
                organization_name: document.getElementById('organization_name').value
            };

            try {
                const response = await fetch('/api/auth/register-ngo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                // Store token and user
                setToken(data.token);
                setUser(data.user);

                alertContainer.innerHTML = '<div class="alert alert-success">NGO registration successful! Redirecting to Dashboard...</div>';
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);
            } catch (error) {
                alertContainer.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
